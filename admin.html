<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOT FRESH — لوحة التحكم السحابية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --p-color: #1e6b76;
    --s-color: #134651;
    --bg-color: #FAF8F5;
    --white: #FFFFFF;
    --line: rgba(19, 70, 81, 0.12);
    --danger: #e74c3c;
    --warning: #f39c12;
    --purple: #8e44ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 15px;
    background: var(--bg-color);
    font-family: 'Cairo', sans-serif;
    color: #134651;
  }
  .login-box, .admin-container {
    max-width: 600px; margin: 20px auto;
    background: var(--white); padding: 25px;
    border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .admin-logo { max-width: 140px; margin: 0 auto 15px; display: block; }
  h2 { margin-top: 0; border-bottom: 2px solid var(--line); padding-bottom: 8px; text-align: center; font-size: 22px; font-weight: 900; }
  input, select, button {
    width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 14px;
  }
  input[type="file"] { background: #fdfaf6; cursor: pointer; }
  button {
    background: var(--p-color); color: white; border: none; font-weight: 800; cursor: pointer; border-radius: 8px;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  
  /* قسم إعدادات كلمة المرور الجانبي */
  .settings-toggle-btn {
    background: #f0f4f5; color: var(--s-color); border: 1px solid var(--line);
    padding: 10px; font-size: 13px; margin-bottom: 15px; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .settings-card {
    background: #fdfaf6; border: 1px solid var(--line);
    border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none;
  }

  .filter-container {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
  }
  .filter-container select, .filter-container input {
    margin: 0; flex: 1; min-width: 180px;
  }

  .item-card {
    background: #fafafa; border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin-bottom: 10px;
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
  }
  .item-info-box { display: flex; align-items: center; gap: 10px; flex: 1; }
  
  .item-number {
    background: var(--s-color);
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .img-box {
    width: 55px; height: 55px; border-radius: 8px; background: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0; border: 1px solid var(--line);
  }
  .img-box img { width: 100%; height: 100%; object-fit: cover; }
  .no-img-text { font-size: 10px; color: #888; text-align: center; }

  .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .btn-sm { width: auto; padding: 6px 10px; font-size: 12px; margin: 0; border-radius: 6px; }
  .btn-edit { background: var(--warning); }
  .btn-del { background: var(--danger); }

  .modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 15px;
  }
  .modal-content {
    background: var(--white); padding: 20px; border-radius: 12px;
    width: 100%; max-width: 450px; box-shadow: 0 5px 25px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <div class="admin-logo">
    <svg viewBox="0 0 300 200" width="100%" height="auto">
      <path d="M150 20 C130 20 115 35 115 55 C115 65 120 73 127 80 L150 120 L173 80 C180 73 185 65 185 55 C185 35 170 20 150 20 Z" fill="#1e6b76"/>
      <path d="M135 55 C135 45 142 40 150 40 C158 40 165 45 165 55" stroke="#FFFFFF" stroke-width="3" fill="none"/>
      <polygon points="140,85 160,85 150,110" fill="#1e6b76"/>
      <path d="M125 60 C120 70 120 80 128 88" stroke="#1e6b76" stroke-width="4" fill="none"/>
      <path d="M175 60 C180 70 180 80 172 88" stroke="#1e6b76" stroke-width="4" fill="none"/>
      <text x="150" y="145" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#1e6b76" text-anchor="middle">TOOT</text>
      <text x="202" y="122" font-family="'Cairo', sans-serif" font-weight="800" font-size="12" fill="#1e6b76" text-anchor="middle">FRESH</text>
      <text x="150" y="165" font-family="'Cairo', sans-serif" font-weight="800" font-size="11" fill="#1e6b76" text-anchor="middle" letter-spacing="2">JUICE AND ICE CREAM</text>
    </svg>
  </div>
  <h2>🔒 تسجيل دخول الإدارة</h2>
  <input type="text" id="user" placeholder="اسم المستخدم" onkeydown="handleLoginKeyPress(event)">
  <input type="password" id="pass" placeholder="كلمة المرور" onkeydown="handleLoginKeyPress(event)">
  <button onclick="login()">دخول</button>
</div>

<div class="admin-container" id="adminBox" style="display:none;">
  <h2>🛠️ إدارة toot</h2>

  <!-- زر جانبي لفتح وإغلاق قائمة تغيير الحساب -->
  <button class="settings-toggle-btn" onclick="toggleSettingsBox()">
    <span>⚙️ تغيير اسم المستخدم وكلمة المرور</span>
    <span id="toggleIcon">▼</span>
  </button>

  <!-- صندوق الحساب الإداري -->
  <div class="settings-card" id="settingsBox">
    <h3 style="margin-top:0; font-size:15px; color:var(--s-color);">🔑 التعديل على بيانات الحساب</h3>
    <input type="password" id="oldAdminPass" placeholder="كلمة المرور الحالية (إجباري) *">
    <input type="text" id="newAdminUser" placeholder="اسم المستخدم الجديد">
    <input type="password" id="newAdminPass" placeholder="كلمة المرور الجديدة">
    <button onclick="updateAdminCredentials()" style="background:var(--purple); margin-bottom:0; margin-top:8px;">💾 تحديث البيانات</button>
  </div>

  <h3>إضافة صنف جديد:</h3>
  <input type="text" id="itemName" placeholder="اسم الصنف">
  <select id="itemSec"></select>
  <input type="text" id="itemPrice" placeholder="السعر (مثال: 5.000 د.ع)">
  
  <label style="font-size: 12px; font-weight: 800; display: block;">صورة للصنف (اختياري):</label>
  <input type="file" id="itemFile" accept="image/*">
  
  <button id="addBtn" onclick="addItem()">➕ إضافة الصنف للمنيو</button>

  <h3 style="margin-top: 25px;">الأصناف الحالية المرفوعة:</h3>
  
  <div class="filter-container">
    <select id="filterSec" onchange="renderAdminItems()">
      <option value="all">كل الأقسام</option>
    </select>
    <input type="text" id="adminSearch" placeholder="🔍 بحث عن صنف..." oninput="renderAdminItems()">
  </div>

  <div id="itemsList">جاري التحميل...</div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">✏️ تعديل بيانات الصنف</h3>
    <input type="hidden" id="editId">
    <label style="font-size:12px; font-weight:800;">اسم الصنف:</label>
    <input type="text" id="editName">
    <label style="font-size:12px; font-weight:800;">القسم:</label>
    <select id="editSec"></select>
    <label style="font-size:12px; font-weight:800;">السعر:</label>
    <input type="text" id="editPrice">
    <label style="font-size:12px; font-weight:800;">تغيير الصورة (اختياري):</label>
    <input type="file" id="editFile" accept="image/*">
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button onclick="saveEdit()" style="background:var(--p-color);">حفظ التغييرات</button>
      <button onclick="closeEditModal()" style="background:#888;">إلغاء</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCYo1y3e-S9y3I_U1kCg8a9J8E7kL0mN1o",
    authDomain: "toot-fresh-menu.firebaseapp.com",
    projectId: "toot-fresh-menu",
    storageBucket: "toot-fresh-menu.appspot.com",
    messagingSenderId: "56360410058",
    appId: "1:56360410058:web:7dbfae782e3c0d832df7ff"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const menuSections = [
    { id: 'icecream', title: 'آيس كريم' },
    { id: 'gelato', title: 'جيلاتو إيطالي' },
    { id: 'hotdrinks', title: 'مشروبات ساخنة' },
    { id: 'colddrinks', title: 'عصائر ومشروبات باردة' },
    { id: 'mojito', title: 'موهيتو وآيس تي' },
    { id: 'milkshake', title: 'ميلك شيك وفراب' },
    { id: 'cakesalad', title: 'كيك وسلطات ودونات' },
    { id: 'crepe', title: 'كريب' },
    { id: 'waffle', title: 'وافل' },
    { id: 'pancake', title: 'بانكيك' },
    { id: 'bano', title: 'كنافة وبانو' },
    { id: 'special', title: 'أصناف مميزة وباولز' },
    { id: 'birthdays', title: 'أعياد الميلاد' }
  ];

  let currentItems = [];
  let adminAuth = { user: 'admin', pass: '123456' };

  db.collection("settings").doc("auth").onSnapshot(doc => {
    if (doc.exists) {
      adminAuth = doc.data();
    }
  });

  function handleLoginKeyPress(e) {
    if (e.key === 'Enter') {
      login();
    }
  }

  function login() {
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    if (u === adminAuth.user && p === adminAuth.pass) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminBox').style.display = 'block';
      loadAdminData();
    } else {
      alert('خطأ في اسم المستخدم أو كلمة المرور!');
    }
  }

  function toggleSettingsBox() {
    const box = document.getElementById('settingsBox');
    const icon = document.getElementById('toggleIcon');
    if (box.style.display === 'block') {
      box.style.display = 'none';
      icon.textContent = '▼';
    } else {
      box.style.display = 'block';
      icon.textContent = '▲';
    }
  }

  function updateAdminCredentials() {
    const oldPass = document.getElementById('oldAdminPass').value.trim();
    const newUser = document.getElementById('newAdminUser').value.trim();
    const newPass = document.getElementById('newAdminPass').value.trim();

    if (!oldPass) return alert('⚠️ يرجى كتابة كلمة المرور الحالية للتأكيد!');
    if (oldPass !== adminAuth.pass) return alert('❌ كلمة المرور الحالية غير صحيحة!');

    const updatedUser = newUser !== '' ? newUser : adminAuth.user;
    const updatedPass = newPass !== '' ? newPass : adminAuth.pass;

    db.collection("settings").doc("auth").set({
      user: updatedUser,
      pass: updatedPass
    }).then(() => {
      alert('🎉 تم تحديث بيانات الدخول بنجاح!');
      document.getElementById('oldAdminPass').value = '';
      document.getElementById('newAdminUser').value = '';
      document.getElementById('newAdminPass').value = '';
      toggleSettingsBox();
    }).catch(() => {
      alert('حدث خطأ أثناء التحديث!');
    });
  }

  function loadAdminData() {
    const secSelect = document.getElementById('itemSec');
    const editSecSelect = document.getElementById('editSec');
    const filterSecSelect = document.getElementById('filterSec');

    secSelect.innerHTML = '';
    editSecSelect.innerHTML = '';
    filterSecSelect.innerHTML = '<option value="all">الكل (جميع الأقسام)</option>';

    menuSections.forEach(s => {
      secSelect.innerHTML += `<option value="${s.id}">${s.title}</option>`;
      editSecSelect.innerHTML += `<option value="${s.id}">${s.title}</option>`;
      filterSecSelect.innerHTML += `<option value="${s.id}">${s.title}</option>`;
    });

    db.collection("items").onSnapshot(snapshot => {
      currentItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderAdminItems();
    });
  }

  function renderAdminItems() {
    const list = document.getElementById('itemsList');
    const query = document.getElementById('adminSearch').value.toLowerCase().trim();
    const selectedSec = document.getElementById('filterSec').value;
    list.innerHTML = '';

    const filtered = currentItems.filter(i => {
      const matchQuery = query === '' || i.name.toLowerCase().includes(query);
      const matchSec = selectedSec === 'all' || i.section === selectedSec;
      return matchQuery && matchSec;
    });

    if (filtered.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:#888;">لا توجد أصناف مطابقة</p>';
      return;
    }

    filtered.forEach((item, index) => {
      const imgContent = item.image 
        ? `<img src="${item.image}" alt="${item.name}">` 
        : `<span class="no-img-text">بدون صورة</span>`;

      list.innerHTML += `
        <div class="item-card">
          <div class="item-info-box">
            <div class="item-number">#${index + 1}</div>
            <div class="img-box">${imgContent}</div>
            <div>
              <strong style="display:block; font-size:14px;">${item.name}</strong>
              <span style="font-size:12.5px; color:var(--p-color); font-weight:800;">${item.price}</span>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-sm btn-edit" onclick="openEditModal('${item.id}')">✏️ تعديل</button>
            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">🗑️ حذف</button>
          </div>
        </div>
      `;
    });
  }

  async function addItem() {
    const name = document.getElementById('itemName').value.trim();
    const section = document.getElementById('itemSec').value;
    const price = document.getElementById('itemPrice').value.trim();
    const fileInput = document.getElementById('itemFile');
    const btn = document.getElementById('addBtn');

    if (!name || !price) return alert('يرجى كتابة الاسم والسعر');

    btn.disabled = true;
    btn.textContent = '⏳ جاري الإضافة...';

    let imageUrl = '';
    if (fileInput.files.length > 0) {
      try { imageUrl = await convertToBase64(fileInput.files[0]); } catch (e) {}
    }

    db.collection("items").add({
      name, price, section, image: imageUrl, createdAt: new Date()
    }).then(() => {
      alert('تمت الإضافة بنجاح!');
      document.getElementById('itemName').value = '';
      document.getElementById('itemPrice').value = '';
      fileInput.value = '';
      btn.disabled = false;
      btn.textContent = '➕ إضافة الصنف للمنيو';
    });
  }

  function openEditModal(id) {
    const item = currentItems.find(i => i.id === id);
    if (!item) return;
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = item.name;
    document.getElementById('editSec').value = item.section || 'icecream';
    document.getElementById('editPrice').value = item.price;
    document.getElementById('editFile').value = '';
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  async function saveEdit() {
    const id = document.getElementById('editId').value;
    const name = document.getElementById('editName').value.trim();
    const section = document.getElementById('editSec').value;
    const price = document.getElementById('editPrice').value.trim();
    const fileInput = document.getElementById('editFile');

    if (!name || !price) return alert('يرجى كتابة الاسم والسعر');

    let updateData = { name, price, section };

    if (fileInput.files.length > 0) {
      try {
        const imageUrl = await convertToBase64(fileInput.files[0]);
        updateData.image = imageUrl;
      } catch (e) {}
    }

    db.collection("items").doc(id).update(updateData).then(() => {
      alert('تم تحديث البيانات بنجاح!');
      closeEditModal();
    });
  }

  function convertToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function deleteItem(id) {
    if (confirm('هل أنت تأكد من الحذف؟')) {
      db.collection("items").doc(id).delete();
    }
  }
</script>
</body>
</html>
