<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOT FRESH — لوحة التحكم</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123d46">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --p-color: #1e6b76;
    --s-color: #134651;
    --bg-color: #FAF8F5;
    --white: #FFFFFF;
    --line: rgba(19, 70, 81, 0.12);
    --danger: #e74c3c;
    --warning: #f39c12;
    --purple: #8e44ad;
    --gray: #7f8c8d;
    --green: #27ae60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 15px;
    background: var(--bg-color);
    font-family: 'Cairo', sans-serif;
    color: #134651;
  }
  .login-box, .admin-container {
    max-width: 600px; margin: 20px auto;
    background: var(--white); padding: 25px;
    border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .admin-logo { max-width: 140px; margin: 0 auto 15px; display: block; }
  h2 { margin-top: 0; border-bottom: 2px solid var(--line); padding-bottom: 8px; text-align: center; font-size: 22px; font-weight: 900; }
  input, select, button {
    width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 14px;
  }
  input[type="file"] { background: #fdfaf6; cursor: pointer; }
  button {
    background: var(--p-color); color: white; border: none; font-weight: 800; cursor: pointer; border-radius: 8px;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  
  .settings-toggle-btn {
    background: #f0f4f5; color: var(--s-color); border: 1px solid var(--line);
    padding: 10px; font-size: 13px; margin-bottom: 15px; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .settings-card {
    background: #fdfaf6; border: 1px solid var(--line);
    border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none;
  }

  .filter-container {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
  }
  .filter-container select, .filter-container input {
    margin: 0; flex: 1; min-width: 180px;
  }

  .item-card {
    background: #fafafa; border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin-bottom: 10px;
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
  }
  .item-card.disabled-item { opacity: 0.6; background: #f2f2f2; }
  .item-info-box { display: flex; align-items: center; gap: 10px; flex: 1; }
  .item-number {
    background: var(--s-color); color: #fff; font-size: 12px; font-weight: 900;
    padding: 4px 8px; border-radius: 6px; flex-shrink: 0;
  }
  .img-box {
    width: 55px; height: 55px; border-radius: 8px; background: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0; border: 1px solid var(--line);
  }
  .img-box img { width: 100%; height: 100%; object-fit: cover; }
  .no-img-text { font-size: 10px; color: #888; text-align: center; }

  .item-actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .btn-sm { width: auto; padding: 6px 8px; font-size: 11.5px; margin: 0; border-radius: 6px; }
  .btn-edit { background: var(--warning); }
  .btn-del { background: var(--danger); }
  .btn-status-on { background: var(--green); }
  .btn-status-off { background: var(--gray); }

  .modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 15px;
  }
  .modal-content {
    background: var(--white); padding: 20px; border-radius: 12px;
    width: 100%; max-width: 450px; box-shadow: 0 5px 25px rgba(0,0,0,0.2);
  }

  .sec-tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; margin-bottom: 10px; }
  .sec-tag {
    background: #eef5f6; border: 1px solid var(--line); padding: 5px 10px;
    border-radius: 12px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px;
  }
  .sec-order-input {
    width: 32px !important; height: 26px !important; padding: 0 !important;
    margin: 0 !important; text-align: center; font-size: 12px; font-weight: 800;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  .sec-action-icon { cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <div class="admin-logo">
    <svg viewBox="0 0 300 200" width="100%" height="auto">
      <path d="M150 20 C130 20 115 35 115 55 C115 65 120 73 127 80 L150 120 L173 80 C180 73 185 65 185 55 C185 35 170 20 150 20 Z" fill="#1e6b76"/>
      <path d="M135 55 C135 45 142 40 150 40 C158 40 165 45 165 55" stroke="#FFFFFF" stroke-width="3" fill="none"/>
      <polygon points="140,85 160,85 150,110" fill="#1e6b76"/>
      <path d="M125 60 C120 70 120 80 128 88" stroke="#1e6b76" stroke-width="4" fill="none"/>
      <path d="M175 60 C180 70 180 80 172 88" stroke="#1e6b76" stroke-width="4" fill="none"/>
      <text x="150" y="145" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" fill="#1e6b76" text-anchor="middle">TOOT</text>
      <text x="202" y="122" font-family="'Cairo', sans-serif" font-weight="800" font-size="12" fill="#1e6b76" text-anchor="middle">FRESH</text>
      <text x="150" y="165" font-family="'Cairo', sans-serif" font-weight="800" font-size="11" fill="#1e6b76" text-anchor="middle" letter-spacing="2">JUICE AND ICE CREAM</text>
    </svg>
  </div>
  <h2>🔒 تسجيل دخول الإدارة</h2>
  <input type="text" id="user" placeholder="اسم المستخدم" autocomplete="off" onkeydown="handleLoginKeyPress(event)">
  <input type="password" id="pass" placeholder="كلمة المرور" autocomplete="off" onkeydown="handleLoginKeyPress(event)">
  <button onclick="login()">دخول</button>
</div>

<div class="admin-container" id="adminBox" style="display:none;">
  <h2>🛠️ إدارة toot</h2>

  <button class="settings-toggle-btn" onclick="toggleSettingsBox()">
    <span>⚙️ تغيير اسم المستخدم وكلمة المرور</span>
    <span id="toggleIcon">▼</span>
  </button>

  <div class="settings-card" id="settingsBox">
    <h3 style="margin-top:0; font-size:15px; color:var(--s-color);">🔑 التعديل على بيانات الحساب</h3>
    <input type="password" id="oldAdminPass" placeholder="كلمة المرور الحالية (إجباري) *" autocomplete="off">
    <input type="text" id="newAdminUser" placeholder="اسم المستخدم الجديد" autocomplete="off">
    <input type="password" id="newAdminPass" placeholder="كلمة المرور الجديدة" autocomplete="off">
    <button onclick="updateAdminCredentials()" style="background:var(--purple); margin-bottom:0; margin-top:8px;">💾 تحديث البيانات</button>
  </div>

  <div style="background: #fdfaf6; border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
    <h3 style="margin-top:0; font-size:15px; color:var(--s-color);">📁 إضافة وإدارة الأقسام:</h3>
    <div style="display:flex; gap:8px;">
      <input type="text" id="newSecTitle" placeholder="اسم القسم الجديد" autocomplete="off" style="margin-top:0; margin-bottom:0;">
      <button onclick="addNewSection()" style="width:120px; margin-top:0; margin-bottom:0; flex-shrink:0;">➕ إضافة</button>
    </div>
    <div class="sec-tag-list" id="sectionsTagList">جاري التحميل...</div>
  </div>

  <h3>إضافة صنف جديد:</h3>
  <input type="text" id="itemName" placeholder="اسم الصنف" autocomplete="off">
  <select id="itemSec"></select>
  <input type="text" id="itemPrice" placeholder="السعر (مثال: 5.000 د.ع)" autocomplete="off">
  
  <label style="font-size: 12px; font-weight: 800; display: block;">صورة للصنف (اختياري):</label>
  <input type="file" id="itemFile" accept="image/*">
  
  <button id="addBtn" onclick="addItem()">➕ إضافة الصنف للمنيو</button>

  <h3 style="margin-top: 25px;">الأصناف الحالية المرفوعة:</h3>
  
  <div class="filter-container">
    <select id="filterSec" onchange="renderAdminItems()">
      <option value="all">كل الأقسام</option>
    </select>
    <input type="text" id="adminSearch" placeholder="🔍 بحث عن صنف..." autocomplete="off" oninput="debouncedRender()">
  </div>

  <div id="itemsList">جاري التحميل...</div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">✏️ تعديل بيانات الصنف</h3>
    <input type="hidden" id="editId">
    <label style="font-size:12px; font-weight:800;">اسم الصنف:</label>
    <input type="text" id="editName" autocomplete="off">
    <label style="font-size:12px; font-weight:800;">القسم:</label>
    <select id="editSec"></select>
    <label style="font-size:12px; font-weight:800;">السعر:</label>
    <input type="text" id="editPrice" autocomplete="off">
    <label style="font-size:12px; font-weight:800;">تغيير الصورة (اختياري):</label>
    <input type="file" id="editFile" accept="image/*">
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button onclick="saveEdit()" style="background:var(--p-color);">حفظ التغييرات</button>
      <button onclick="closeEditModal()" style="background:#888;">إلغاء</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCYo1y3e-S9y3I_U1kCg8a9J8E7kL0mN1o",
    authDomain: "toot-fresh-menu.firebaseapp.com",
    projectId: "toot-fresh-menu",
    storageBucket: "toot-fresh-menu.appspot.com",
    messagingSenderId: "56360410058",
    appId: "1:56360410058:web:7dbfae782e3c0d832df7ff"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const defaultSections = [
    { id: 'icecream', title: 'آيس كريم', order: 1 },
    { id: 'gelato', title: 'جيلاتو إيطالي', order: 2 },
    { id: 'hotdrinks', title: 'مشروبات ساخنة', order: 3 },
    { id: 'colddrinks', title: 'عصائر ومشروبات باردة', order: 4 },
    { id: 'mojito', title: 'موهيتو وآيس تي', order: 5 },
    { id: 'milkshake', title: 'ميلك شيك وفراب', order: 6 },
    { id: 'cakesalad', title: 'كيك وسلطات ودونات', order: 7 },
    { id: 'crepe', title: 'كريب', order: 8 },
    { id: 'waffle', title: 'وافل', order: 9 },
    { id: 'pancake', title: 'بانكيك', order: 10 },
    { id: 'bano', title: 'كنافة وبانو', order: 11 },
    { id: 'special', title: 'أصناف مميزة وباولز', order: 12 },
    { id: 'birthdays', title: 'أعياد الميلاد', order: 13 }
  ];

  let menuSections = [];
  let currentItems = [];
  let adminAuth = { user: 'admin', pass: '123456' };
  let searchTimeout = null;

  db.collection("settings").doc("auth").onSnapshot(doc => {
    if (doc.exists) adminAuth = doc.data();
  });

  function handleLoginKeyPress(e) { if (e.key === 'Enter') login(); }

  function login() {
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    if (u === adminAuth.user && p === adminAuth.pass) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminBox').style.display = 'block';
      loadAdminData();
    } else alert('خطأ في اسم المستخدم أو كلمة المرور!');
  }

  function toggleSettingsBox() {
    const box = document.getElementById('settingsBox');
    const icon = document.getElementById('toggleIcon');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
    icon.textContent = box.style.display === 'block' ? '▲' : '▼';
  }

  function updateAdminCredentials() {
    const oldPass = document.getElementById('oldAdminPass').value.trim();
    const newUser = document.getElementById('newAdminUser').value.trim();
    const newPass = document.getElementById('newAdminPass').value.trim();

    if (!oldPass) return alert('⚠️ يرجى كتابة كلمة المرور الحالية للتأكيد!');
    if (oldPass !== adminAuth.pass) return alert('❌ كلمة المرور الحالية غير صحيحة!');

    db.collection("settings").doc("auth").set({
      user: newUser !== '' ? newUser : adminAuth.user,
      pass: newPass !== '' ? newPass : adminAuth.pass
    }).then(() => {
      alert('🎉 تم تحديث بيانات الدخول بنجاح!');
      document.getElementById('oldAdminPass').value = '';
      document.getElementById('newAdminUser').value = '';
      document.getElementById('newAdminPass').value = '';
      toggleSettingsBox();
    });
  }

  function loadAdminData() {
    db.collection("sections").onSnapshot(snapshot => {
      if (snapshot.empty) {
        defaultSections.forEach(s => db.collection("sections").doc(s.id).set(s));
      } else {
        menuSections = snapshot.docs.map(doc => doc.data());
        menuSections.sort((a, b) => (a.order || 0) - (b.order || 0));
        populateSectionsUI();
      }
    });

    db.collection("items").onSnapshot(snapshot => {
      currentItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderAdminItems();
    });
  }

  function populateSectionsUI() {
    const secSelect = document.getElementById('itemSec');
    const editSecSelect = document.getElementById('editSec');
    const filterSecSelect = document.getElementById('filterSec');
    const tagsContainer = document.getElementById('sectionsTagList');

    secSelect.innerHTML = '';
    editSecSelect.innerHTML = '';
    filterSecSelect.innerHTML = '<option value="all">الكل (جميع الأقسام)</option>';
    tagsContainer.innerHTML = '';

    menuSections.forEach((s, idx) => {
      secSelect.innerHTML += `<option value="${s.id}">${s.title}</option>`;
      editSecSelect.innerHTML += `<option value="${s.id}">${s.title}</option>`;
      filterSecSelect.innerHTML += `<option value="${s.id}">${s.title}</option>`;
      
      const currentOrder = s.order !== undefined ? s.order : (idx + 1);

      tagsContainer.innerHTML += `
        <div class="sec-tag">
          <input type="number" class="sec-order-input" value="${currentOrder}" onchange="updateSectionOrder('${s.id}', this.value)">
          <span>${s.title}</span>
          <span class="sec-action-icon" style="color:var(--warning);" onclick="editSection('${s.id}', '${s.title}')">✏️</span>
          <span class="sec-action-icon" style="color:var(--danger);" onclick="deleteSection('${s.id}', '${s.title}')">✕</span>
        </div>
      `;
    });
  }

  function updateSectionOrder(id, newOrderVal) {
    const newOrder = parseInt(newOrderVal) || 0;
    db.collection("sections").doc(id).update({ order: newOrder });
  }

  function addNewSection() {
    const title = document.getElementById('newSecTitle').value.trim();
    if (!title) return alert('⚠️ يرجى كتابة اسم القسم أولاً!');

    const id = 'sec_' + Date.now();
    const newOrder = menuSections.length > 0 ? (Math.max(...menuSections.map(s => s.order || 0)) + 1) : 1;
    
    db.collection("sections").doc(id).set({ id, title, order: newOrder }).then(() => {
      document.getElementById('newSecTitle').value = '';
    });
  }

  function editSection(id, oldTitle) {
    const newTitle = prompt('أدخل الاسم الجديد للقسم:', oldTitle);
    if (newTitle !== null && newTitle.trim() !== '') {
      db.collection("sections").doc(id).update({ title: newTitle.trim() });
    }
  }

  function deleteSection(id, title) {
    if (confirm(`هل أنت تأكد من حذف قسم (${title})؟`)) {
      db.collection("sections").doc(id).delete();
    }
  }

  function debouncedRender() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => renderAdminItems(), 150);
  }

  function renderAdminItems() {
    const list = document.getElementById('itemsList');
    const query = document.getElementById('adminSearch').value.toLowerCase().trim();
    const selectedSec = document.getElementById('filterSec').value;

    const filtered = currentItems.filter(i => {
      return (query === '' || i.name.toLowerCase().includes(query)) &&
             (selectedSec === 'all' || i.section === selectedSec);
    });

    if (filtered.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:#888;">لا توجد أصناف مطابقة</p>';
      return;
    }

    let htmlBuffer = '';
    filtered.forEach((item, index) => {
      const imgContent = item.image 
        ? `<img src="${item.image}" alt="${item.name}">` 
        : `<span class="no-img-text">بدون صورة</span>`;

      const isAvailable = item.isAvailable !== false;

      htmlBuffer += `
        <div class="item-card ${isAvailable ? '' : 'disabled-item'}">
          <div class="item-info-box">
            <div class="item-number">#${index + 1}</div>
            <div class="img-box">${imgContent}</div>
            <div>
              <strong style="display:block; font-size:14px;">${item.name}</strong>
              <span style="font-size:12.5px; color:var(--p-color); font-weight:800;">${item.price}</span>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-sm ${isAvailable ? 'btn-status-on' : 'btn-status-off'}" onclick="toggleItemStatus('${item.id}', ${isAvailable})">
              ${isAvailable ? '✅ متوفر' : '🚫 غير متوفر'}
            </button>
            <button class="btn-sm btn-edit" onclick="openEditModal('${item.id}')">✏️ تعديل</button>
            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">🗑️ حذف</button>
          </div>
        </div>
      `;
    });
    list.innerHTML = htmlBuffer;
  }

  function toggleItemStatus(id, currentStatus) {
    db.collection("items").doc(id).update({ isAvailable: !currentStatus });
  }

  async function addItem() {
    const name = document.getElementById('itemName').value.trim();
    const section = document.getElementById('itemSec').value;
    const price = document.getElementById('itemPrice').value.trim();
    const fileInput = document.getElementById('itemFile');
    const btn = document.getElementById('addBtn');

    if (!name || !price) return alert('يرجى كتابة الاسم والسعر');

    btn.disabled = true;
    btn.textContent = '⏳ جاري الإضافة...';

    let imageUrl = '';
    if (fileInput.files.length > 0) {
      try { imageUrl = await convertToBase64(fileInput.files[0]); } catch (e) {}
    }

    db.collection("items").add({
      name, price, section, image: imageUrl, isAvailable: true, createdAt: new Date()
    }).then(() => {
      alert('تمت الإضافة بنجاح!');
      document.getElementById('itemName').value = '';
      document.getElementById('itemPrice').value = '';
      fileInput.value = '';
      btn.disabled = false;
      btn.textContent = '➕ إضافة الصنف للمنيو';
    });
  }

  function openEditModal(id) {
    const item = currentItems.find(i => i.id === id);
    if (!item) return;
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = item.name;
    document.getElementById('editSec').value = item.section || 'icecream';
    document.getElementById('editPrice').value = item.price;
    document.getElementById('editFile').value = '';
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

  async function saveEdit() {
    const id = document.getElementById('editId').value;
    const name = document.getElementById('editName').value.trim();
    const section = document.getElementById('editSec').value;
    const price = document.getElementById('editPrice').value.trim();
    const fileInput = document.getElementById('editFile');

    if (!name || !price) return alert('يرجى كتابة الاسم والسعر');

    let updateData = { name, price, section };

    if (fileInput.files.length > 0) {
      try { updateData.image = await convertToBase64(fileInput.files[0]); } catch (e) {}
    }

    db.collection("items").doc(id).update(updateData).then(() => {
      alert('تم تحديث البيانات بنجاح!');
      closeEditModal();
    });
  }

  function convertToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function deleteItem(id) {
    if (confirm('هل أنت تأكد من الحذف؟')) {
      db.collection("items").doc(id).delete();
    }
  }
</script>
</body>
</html>
